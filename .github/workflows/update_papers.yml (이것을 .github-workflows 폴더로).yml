# =============================================================
#  소동물 논문 큐레이션 — 매일 자동 실행 워크플로
#  파일 위치(반드시):  .github/workflows/update_papers.yml
# =============================================================
name: Update Papers Daily

on:
  schedule:
    # 🔧 실행 시각(UTC). 한국시간(KST) = UTC + 9.
    #   ※ GitHub 스케줄러는 정각(:00)에 작업이 몰려 지연·누락이 잦음 → '분'을 어긋나게 두고,
    #     아침에 2번(누락 대비 백업) 실행해 안정성을 높임. 중복은 PMID로 자동 제거돼 문제 없음.
    - cron: "23 22 * * *"   # 07:23 KST (주 실행)
    - cron: "23 0 * * *"    # 09:23 KST (백업 — 7시가 건너뛰면 여기서 채움)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write           # papers.json 커밋 권한

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 전체 이력 (push 전 rebase 안정화)

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 논문 수집 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # 요약용 (무료·권장). 없으면 아래 순서로 폴백
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 요약용 (유료·선택). 둘 다 없으면 요약 생략
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}             # (선택) 있으면 수집이 3배 빨라짐
          START_DATE: "2026-01-01"   # 🔧 이 날짜부터 오늘까지 모음 (고정 시작일)
          INCREMENTAL_DAYS: "0"      # 0 = 매일 START_DATE~오늘 전체 조회(누락 없음). 속도 필요시 30 등
          MAX_RESULTS: "0"           # 0 = 제한 없음 (수만 개까지)
          ABSTRACT_MAXLEN: "0"       # 0 = 초록 전체. 파일 커지면 800 등으로 제한
        run: python fetch_papers.py

      - name: papers.json 자동 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers.json
          # 변경 없으면 여기서 정상 종료 (커밋할 것 없음)
          git diff --staged --quiet && echo "변경 없음 — 커밋 생략" && exit 0
          git commit -m "논문 자동 업데이트: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 원격에 새 커밋이 있으면 먼저 합친 뒤(rebase) 밀어넣기. 여러 번 재시도.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push 재시도 $i…"; sleep 3
          done
          echo "5회 시도 후에도 push 실패"; exit 1
